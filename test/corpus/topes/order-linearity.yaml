id: topes.1
source: topes
tags: [tope-prop, leq, linearity]
provenance:
  kind: handwritten
  note: >-
    linearity of the directed interval, an axiom of the tope layer. Note the
    shape: this is an excluded middle for <=, and it is derivable, whereas the
    excluded middle of simple.4 is not. A solver that discharges this by
    generic classical reasoning is wrong for the wrong reason, so it should be
    read together with topes.9.
context:
  - "t : 2"
  - "s : 2"
premises: []
goal: 't <= s \/ s <= t'
expected:
  entailment: derivable
  premises_consistency: consistent
